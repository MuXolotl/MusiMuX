name: Release

# Секрет VKMUX_BOT_TOKEN намеренно сохраняет старое имя после переименования
# репозиториев в MusiMuX: секрет на GitHub нельзя переименовать, только выпустить
# новый токен. Не трогать и не «приводить к единообразию».

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 0.1.0)'
        required: true
        default: '0.1.0'
      prerelease:
        description: 'Отметить как pre-release (бета/тест)'
        required: false
        type: boolean
        default: false
      source_ref:
        description: 'Ветка приватного репозитория'
        required: true
        default: 'main'
        type: string
      build_linux_amd64:
        description: 'Собрать Linux x64 (.deb, .AppImage)'
        required: false
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Собрать Linux ARM64 (.deb, .AppImage)'
        required: false
        type: boolean
        default: true
      build_windows_amd64:
        description: 'Собрать Windows x64 (.msi, .exe)'
        required: false
        type: boolean
        default: true
      build_macos_arm64:
        description: 'Собрать macOS Apple Silicon (.dmg)'
        required: false
        type: boolean
        default: true
      build_macos_amd64:
        description: 'Собрать macOS Intel (.dmg)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  TZ: Asia/Yekaterinburg

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: 🏷️ Sync version ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.event.inputs.version }}
      is_prerelease: ${{ github.event.inputs.prerelease }}
    steps:
      - name: 📥 Checkout private source
        uses: actions/checkout@v7
        with:
          repository: MuXolotl/MusiMuX-dev
          token: ${{ secrets.VKMUX_BOT_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}

      - name: 🛡️ Обычный релиз только из main
        # Коммит версии и тег уходят в main приватного репо: из другой ветки это запрещено
        if: ${{ github.event.inputs.prerelease != 'true' && github.event.inputs.prerelease != true }}
        run: |
          if [ "${{ github.event.inputs.source_ref }}" != "main" ]; then
            echo "Обычный релиз собирается только из main; для других веток включите pre-release" >&2
            exit 1
          fi

      - name: 📝 Validate changelog
        # Pre-release без описания: CHANGELOG не читаем и приватный репо не трогаем
        if: ${{ github.event.inputs.prerelease != 'true' && github.event.inputs.prerelease != true }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          export VERSION
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text()
          start_marker = "<!-- mux-changelog:start -->"
          end_marker = "<!-- mux-changelog:end -->"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          changes = text[start:end].strip()
          if not changes:
              released = re.search(
                  rf"^## \[{re.escape(version)}\](?: — [^\n]*)?\n\n(.*?)(?=\n\n---)",
                  text,
                  flags=re.MULTILINE | re.DOTALL,
              )
              changes = released.group(1).strip() if released else ""
          if not changes:
              raise SystemExit(
                  "CHANGELOG.md: нет изменений между маркерами и раздела текущей версии"
              )
          Path("release_changes.md").write_text(changes + "\n")
          PY

      - name: 📦 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 🔄 Sync version to all files
        # Коммит, тег и пуш в main — только для обычного релиза. Pre-release
        # ничего не пишет в приватный репо: версию сборка ставит у себя (см. build)
        if: ${{ github.event.inputs.prerelease != 'true' && github.event.inputs.prerelease != true }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          export VERSION
          echo "Version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          # Запасная версия в разметке зеркала сайта: при загрузке страницы её
          # подменяет releases.json, но без сети читается именно этот текст.
          # Проверка после подстановки: sed без совпадений ошибкой не считается
          sed -i.bak "s|<b data-version>[^<]*</b>|<b data-version>$VERSION</b>|" .public-sync/site/index.html && rm -f .public-sync/site/index.html.bak
          sed -i.bak "s|<span data-version>[^<]*</span>|<span data-version>$VERSION</span>|" .public-sync/site/download.html && rm -f .public-sync/site/download.html.bak
          grep -q "<b data-version>$VERSION</b>" .public-sync/site/index.html || { echo "index.html: версия не проставлена" >&2; exit 1; }
          grep -q "<span data-version>$VERSION</span>" .public-sync/site/download.html || { echo "download.html: версия не проставлена" >&2; exit 1; }
          cargo metadata --format-version 1 --no-deps > /dev/null
          python3 <<'PY'
          import datetime
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("CHANGELOG.md")
          text = path.read_text()
          start_marker = "<!-- mux-changelog:start -->"
          end_marker = "<!-- mux-changelog:end -->"
          start = text.index(start_marker)
          content_start = start + len(start_marker)
          end = text.index(end_marker, content_start)
          content = text[content_start:end].strip()
          released = re.search(
              rf"^## \[{re.escape(version)}\](?: — .*)?$",
              text,
              flags=re.MULTILINE,
          )
          if content:
              separator = text.index("\n\n---", end + len(end_marker))
              release = (
                  f"{start_marker}\n{end_marker}\n\n---\n\n"
                  f"## [{version}] — {datetime.date.today().isoformat()}\n\n"
                  f"{content}\n\n---"
              )
              text = text[:start] + release + text[separator + len("\n\n---"):]
              unreleased = re.search(r"^\[Unreleased\]: .+$", text, flags=re.MULTILINE)
              if unreleased is None:
                  raise SystemExit("CHANGELOG.md: ссылка Unreleased не найдена")
              source = "https://github.com/MuXolotl/MusiMuX-dev"
              releases = "https://github.com/MuXolotl/MusiMuX"
              links = (
                  f"[Unreleased]: {source}/compare/v{version}...HEAD\n"
                  f"[{version}]: {releases}/releases/tag/v{version}"
              )
              text = text[:unreleased.start()] + links + text[unreleased.end():]
              path.write_text(text)
          elif released is None:
              raise SystemExit("CHANGELOG.md: список изменений пуст")
          PY
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json package-lock.json Cargo.lock src-tauri/tauri.conf.json src-tauri/Cargo.toml .public-sync/site/index.html .public-sync/site/download.html
          git diff --staged --quiet || git commit -m "chore: release v$VERSION [skip ci]"
          git tag "v$VERSION" || echo "Tag v$VERSION already exists"
          git push --follow-tags origin HEAD:main || git push origin HEAD:main

  plan:
    name: 🧭 Выбор платформ
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 🧭 Собрать список сборок
        id: plan
        env:
          BUILD_LINUX_AMD64: ${{ github.event.inputs.build_linux_amd64 }}
          BUILD_LINUX_ARM64: ${{ github.event.inputs.build_linux_arm64 }}
          BUILD_WINDOWS_AMD64: ${{ github.event.inputs.build_windows_amd64 }}
          BUILD_MACOS_ARM64: ${{ github.event.inputs.build_macos_arm64 }}
          BUILD_MACOS_AMD64: ${{ github.event.inputs.build_macos_amd64 }}
        run: |
          items=()
          add() { items+=("{\"platform\":\"$1\",\"args\":\"$2\",\"job_name\":\"$3\"}"); }
          [[ "$BUILD_LINUX_AMD64" == "true" ]]   && add ubuntu-22.04     ""                                 linux-amd64
          [[ "$BUILD_LINUX_ARM64" == "true" ]]   && add ubuntu-22.04-arm ""                                 linux-arm64
          [[ "$BUILD_WINDOWS_AMD64" == "true" ]] && add windows-latest   ""                                 windows-amd64
          [[ "$BUILD_MACOS_ARM64" == "true" ]]   && add macos-latest     "--target aarch64-apple-darwin"    macos-arm64
          [[ "$BUILD_MACOS_AMD64" == "true" ]]   && add macos-latest     "--target x86_64-apple-darwin"     macos-amd64
          if [ ${#items[@]} -eq 0 ]; then
            echo "Не выбрано ни одной платформы" >&2
            exit 1
          fi
          matrix="{\"include\":[$(IFS=,; echo "${items[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: 🏗️ Build ${{ matrix.job_name }}
    needs: [version, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout private source
        uses: actions/checkout@v7
        with:
          repository: MuXolotl/MusiMuX-dev
          token: ${{ secrets.VKMUX_BOT_TOKEN }}
          ref: ${{ github.event.inputs.source_ref }}

      - name: ⬇️ Pull latest
        run: git pull origin "${{ github.event.inputs.source_ref }}"

      - name: 🔧 Install dependencies (ubuntu)
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            ca-certificates
          sudo apt-get install -y --reinstall ca-certificates
          sudo update-ca-certificates -f

      - name: 📦 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🍎 Cross-compile env (macOS x86_64)
        if: matrix.job_name == 'macos-amd64'
        run: |
          echo "CFLAGS=-arch x86_64"                           >> $GITHUB_ENV
          echo "CXXFLAGS=-arch x86_64"                         >> $GITHUB_ENV
          echo "LDFLAGS=-arch x86_64"                          >> $GITHUB_ENV
          echo "CC_x86_64_apple_darwin=clang -arch x86_64"     >> $GITHUB_ENV
          echo "CXX_x86_64_apple_darwin=clang++ -arch x86_64"  >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=clang" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=10.13"                >> $GITHUB_ENV

      - name: 🔄 Set version in working copy (без коммита)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          export VERSION
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          grep -q "\"version\": \"$VERSION\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json: версия не проставлена" >&2; exit 1; }
          # MSI (WiX) принимает только числовую версию: 0.13.0-beta.1 -> 0.13.0.1.
          # Версия приложения остаётся прежней; сопоставление нужно только для MSI.
          base="${VERSION%%-*}"
          wix="$base"
          if [[ "$VERSION" == *-* ]]; then
            pre="${VERSION#*-}"
            last="${pre##*.}"
            if [[ "$last" =~ ^[0-9]+$ ]]; then n="$last"; else n=0; fi
            wix="$base.$n"
          fi
          echo "{\"bundle\":{\"windows\":{\"wix\":{\"version\":\"$wix\"}}}}" > "$RUNNER_TEMP/wix-version.json"
          echo "MSI version: $wix"

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 📁 Create binaries directory
        run: mkdir -p src-tauri/binaries
        shell: bash

      - name: 📥 Download FFmpeg Sidecar (Windows)
        if: matrix.job_name == 'windows-amd64'
        shell: bash
        run: |
          curl -L -o ffmpeg-temp.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/8.1.2/ffmpeg-windows-x64.zip
          unzip -q ffmpeg-temp.zip
          mv ffmpeg.exe src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          rm -f ffmpeg-temp.zip

      - name: 📥 Download FFmpeg Sidecar (Linux x64)
        if: matrix.job_name == 'linux-amd64'
        shell: bash
        run: |
          curl -L -o ffmpeg-temp.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xJf ffmpeg-temp.tar.xz
          FFMPEG_BIN=ffmpeg-master-latest-linux64-lgpl/bin/ffmpeg
          mv "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          rm -rf ffmpeg-master-latest-linux64-lgpl ffmpeg-temp.tar.xz

      - name: 📥 Download FFmpeg Sidecar (Linux ARM64)
        if: matrix.job_name == 'linux-arm64'
        shell: bash
        run: |
          curl -L -o ffmpeg-temp.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-lgpl.tar.xz
          tar -xJf ffmpeg-temp.tar.xz
          FFMPEG_BIN=ffmpeg-master-latest-linuxarm64-lgpl/bin/ffmpeg
          mv "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-aarch64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-aarch64-unknown-linux-gnu
          rm -rf ffmpeg-master-latest-linuxarm64-lgpl ffmpeg-temp.tar.xz

      - name: 📥 Download FFmpeg Sidecar (macOS Intel)
        if: matrix.job_name == 'macos-amd64'
        shell: bash
        run: |
          curl -L -o ffmpeg-temp.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/8.1.2/ffmpeg-osx-x64.zip
          unzip -q ffmpeg-temp.zip
          mv ffmpeg src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          rm -f ffmpeg-temp.zip

      - name: 📥 Download FFmpeg Sidecar (macOS ARM64)
        if: matrix.job_name == 'macos-arm64'
        shell: bash
        run: |
          curl -L -o ffmpeg-temp.zip https://github.com/Tyrrrz/FFmpegBin/releases/download/8.1.2/ffmpeg-osx-arm64.zip
          unzip -q ffmpeg-temp.zip
          mv ffmpeg src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          rm -f ffmpeg-temp.zip

      - name: Проверка FFmpeg (локальный MP3 и HLS по сети)
        shell: bash
        run: |
          shopt -s nullglob
          FILES=(src-tauri/binaries/ffmpeg-*)
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Ожидался один файл FFmpeg, найдено: ${#FILES[@]}"
            exit 1
          fi
          BIN="${FILES[0]}"
          echo "Проверяем $BIN"
          # 1. Кодирование без сети
          "$BIN" -hide_banner -loglevel error -y -f lavfi -i sine=d=1 -c:a libmp3lame check-local.mp3
          # 2. Загрузка HLS по HTTPS и перекодирование в MP3, как в приложении.
          #    Падение процесса (например, сегфолт) роняет шаг.
          "$BIN" -hide_banner -loglevel error -y -i "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8" -t 5 -c:a libmp3lame -b:a 320k -f mp3 check-hls.mp3
          test -s check-hls.mp3
          rm -f check-local.mp3 check-hls.mp3
          echo "FFmpeg работает"

      - name: 🏗️ Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
        with:
          args: ${{ matrix.args }} --config ${{ runner.temp }}/wix-version.json

      - name: 📝 Rename artifacts
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          case "${{ matrix.job_name }}" in
            windows-amd64) PLATFORM="windows-x64" ;;
            linux-amd64)   PLATFORM="linux-x64" ;;
            linux-arm64)   PLATFORM="linux-arm64" ;;
            macos-arm64)   PLATFORM="macos-arm64" ;;
            macos-amd64)   PLATFORM="macos-intel" ;;
          esac
          mkdir -p artifacts
          # Установщики + updater-артефакты (.app.tar.gz для macOS, подписи .sig).
          # Только из bundle/ — иначе find цепляет сырой бинарник target/release/app.exe.
          find target -type f -path "*/bundle/*" \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \
               -o -name "*.app.tar.gz" -o -name "*.exe.sig" -o -name "*.AppImage.sig" -o -name "*.app.tar.gz.sig" \) \
            ! -name "*.zip" | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *.exe.sig)        ext="exe.sig" ;;
              *)                ext="${base##*.}" ;;
            esac
            cp "$f" "artifacts/MusiMuX-${VERSION}-${PLATFORM}.${ext}"
            echo "✅ MusiMuX-${VERSION}-${PLATFORM}.${ext}"
          done
          ls -la artifacts/

      - name: 📝 Build release body
        shell: bash
        run: |
          # Pre-release без описания: тело пустое, блок mux-release-notes не нужен
          if [ "${{ needs.version.outputs.is_prerelease }}" = "true" ]; then
            : > release_body.md
            exit 0
          fi
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]( — .*)?$" { inside=1; found=1; next }
            inside && /^---$/ { inside=0; exit }
            inside { print }
            END {
              if (!found) exit 2
              if (inside) exit 3
            }
          ' CHANGELOG.md > release_changes.md
          if [ -z "$(tr -d '[:space:]' < release_changes.md)" ]; then
            echo "CHANGELOG.md: раздел версии $VERSION пуст" >&2
            exit 1
          fi

          {
            echo "## MusiMuX v${VERSION}"
            echo
            cat release_changes.md
          } > updater_notes.md

          cat > release_body.md <<EOF
          # 🎵 MusiMuX v${VERSION}

          **MusiMuX** — музыкальный десктоп-клиент. Работает полностью локально — без внешних серверов.

          🌐 Сайт приложения: https://muxolotl.github.io/MusiMuX

          ## Скачать

          | Система | Файлы |
          |---|---|
          | Windows x64 | [EXE](${BASE}/MusiMuX-${VERSION}-windows-x64.exe) · [MSI](${BASE}/MusiMuX-${VERSION}-windows-x64.msi) |
          | macOS Apple Silicon | [DMG](${BASE}/MusiMuX-${VERSION}-macos-arm64.dmg) |
          | macOS Intel | [DMG](${BASE}/MusiMuX-${VERSION}-macos-intel.dmg) |
          | Linux x64 | [AppImage](${BASE}/MusiMuX-${VERSION}-linux-x64.AppImage) · [DEB](${BASE}/MusiMuX-${VERSION}-linux-x64.deb) |
          | Linux ARM64 | [AppImage](${BASE}/MusiMuX-${VERSION}-linux-arm64.AppImage) · [DEB](${BASE}/MusiMuX-${VERSION}-linux-arm64.deb) |

          ## Что изменилось

          <!-- mux-release-notes:start -->
          $(cat updater_notes.md)
          <!-- mux-release-notes:end -->

          ## Важно

          ⚠️ Приложение пока без цифровой подписи — при первом запуске подтвердите запуск вручную (SmartScreen на Windows, Gatekeeper на macOS).

          ### Установка на Linux

          Пакет .deb ставится через apt из папки со скачанным файлом — зависимости подтянутся сами:

          \`\`\`bash
          sudo apt install ./MusiMuX-${VERSION}-linux-x64.deb
          \`\`\`

          AppImage нужно сделать исполняемым перед запуском:

          \`\`\`bash
          chmod +x MusiMuX-${VERSION}-linux-x64.AppImage
          ./MusiMuX-${VERSION}-linux-x64.AppImage
          \`\`\`

          Для ARM64 в именах файлов вместо \`x64\` — \`arm64\`. Если AppImage не запускается на свежем Ubuntu, ему не хватает библиотеки FUSE 2: \`sudo apt install libfuse2\`.

          ### Первый запуск на macOS

          Откройте .dmg и перетащите MusiMuX в папку «Программы». Сборка не подписана, поэтому первый запуск macOS заблокирует: попробуйте открыть приложение, а затем разрешите его в «Настройки» → «Конфиденциальность и безопасность» → «Открыть всё равно». В macOS до 15-й версии работает и правый клик по приложению → «Открыть».

          Или вообще без блокировки: снимите карантин со скачанного файла в Терминале ещё до его открытия:

          \`\`\`bash
          xattr -dr com.apple.quarantine ~/Downloads/MusiMuX-${VERSION}-macos-arm64.dmg
          \`\`\`

          Для Mac с процессором Intel в имени файла вместо \`arm64\` — \`intel\`.
          EOF

      - name: 📤 Upload to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: MusiMuX v${{ needs.version.outputs.version }}
          body_path: release_body.md
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          files: artifacts/*

  updater-manifest:
    name: 📡 Generate latest.json
    needs: [version, build]
    # latest.json нужен только обычному релизу: автообновление читает последний релиз
    if: needs.version.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Build & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          gh release download "$TAG" -R "$REPO" --pattern "*.sig" -D sigs
          # Пустая строка, если артефакта нет (например, сборка платформы упала)
          sig() { cat "sigs/MusiMuX-${VERSION}-$1" 2>/dev/null || true; }

          BODY=$(gh release view "$TAG" -R "$REPO" --json body -q .body)
          NOTES=$(printf '%s\n' "$BODY" | awk '
            /<!-- mux-release-notes:start -->/ { inside=1; found=1; next }
            /<!-- mux-release-notes:end -->/ { inside=0; next }
            inside { print }
            END {
              if (!found) exit 2
              if (inside) exit 3
            }
          ')
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "В теле релиза нет блока mux-release-notes" >&2
            exit 1
          fi

          jq -n \
            --arg version  "$VERSION" \
            --arg notes    "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base     "$BASE" \
            --arg v        "MusiMuX-${VERSION}" \
            --arg sig_win        "$(sig windows-x64.exe.sig)" \
            --arg sig_mac_arm    "$(sig macos-arm64.app.tar.gz.sig)" \
            --arg sig_mac_intel  "$(sig macos-intel.app.tar.gz.sig)" \
            --arg sig_linux      "$(sig linux-x64.AppImage.sig)" \
            --arg sig_linux_arm  "$(sig linux-arm64.AppImage.sig)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ({
                "windows-x86_64": { signature: $sig_win,       url: ($base + "/" + $v + "-windows-x64.exe") },
                "darwin-aarch64": { signature: $sig_mac_arm,   url: ($base + "/" + $v + "-macos-arm64.app.tar.gz") },
                "darwin-x86_64":  { signature: $sig_mac_intel, url: ($base + "/" + $v + "-macos-intel.app.tar.gz") },
                "linux-x86_64":   { signature: $sig_linux,     url: ($base + "/" + $v + "-linux-x64.AppImage") },
                "linux-aarch64":  { signature: $sig_linux_arm, url: ($base + "/" + $v + "-linux-arm64.AppImage") }
              } | with_entries(select(.value.signature != "")))
            }' > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json --clobber -R "$REPO"

  site-update:
    name: 🌐 Update site releases.json
    needs: [version, build]
    # Pre-release не должен менять ссылки сайта на тестовую сборку
    if: needs.version.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.VKMUX_BOT_TOKEN }}

      - name: 🔄 Generate releases.json
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > site/releases.json <<EOF
          {
            "version": "${VERSION}",
            "assets": {
              "windows-installer":     "${BASE}/MusiMuX-${VERSION}-windows-x64.msi",
              "windows-exe":           "${BASE}/MusiMuX-${VERSION}-windows-x64.exe",
              "macos-arm64":           "${BASE}/MusiMuX-${VERSION}-macos-arm64.dmg",
              "macos-intel":           "${BASE}/MusiMuX-${VERSION}-macos-intel.dmg",
              "linux-deb":             "${BASE}/MusiMuX-${VERSION}-linux-x64.deb",
              "linux-appimage":        "${BASE}/MusiMuX-${VERSION}-linux-x64.AppImage",
              "linux-arm64-deb":       "${BASE}/MusiMuX-${VERSION}-linux-arm64.deb",
              "linux-arm64-appimage":  "${BASE}/MusiMuX-${VERSION}-linux-arm64.AppImage"
            }
          }
          EOF

      - name: 💾 Commit & push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/releases.json
          git diff --staged --quiet || git commit -m "chore(site): update releases.json to v${{ needs.version.outputs.version }}"
          git push origin HEAD:main
